# Nginx как reverse proxy для Cam Access Monitor.
# - /       → статика из frontend/
# - /api/   → backend FastAPI
# - /frame  → backend FastAPI
# - /docs   → backend FastAPI (документация)
#
# ВАЖНО: используем resolver 127.0.0.11 (DNS Docker) и переменную $backend,
# чтобы Nginx резолвил имя "backend" не при старте, а при запросе.
# Иначе конфиг падает с "host not found in upstream".

server {
    listen 80;
    server_name _;

    # DNS-сервер Docker
    resolver 127.0.0.11 valid=30s ipv6=off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    client_max_body_size 10m;


    # Статика — HTML/CSS/JS
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API — проксируем на FastAPI
    location /api/ {
        set $backend_upstream http://backend:8000;

        # Убираем префикс /api
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }


    # Кадр с камеры
    location /frame {
        set $backend_frame http://backend:8000/frame;
        proxy_pass $backend_frame;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }


    # Документация FastAPI
    location /docs {
        set $backend_docs http://backend:8000/docs;
        proxy_pass $backend_docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $backend_openapi http://backend:8000/openapi.json;
        proxy_pass $backend_openapi;
        proxy_set_header Host $host;
    }
}
