<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cam Access Monitor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1d23;
            color: #e4e7eb;
            padding: 20px;
        }
        header {
            border-bottom: 1px solid #2d3340;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { font-size: 22px; font-weight: 600; }
        .subtitle { color: #8b94a3; font-size: 14px; margin-top: 4px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }
        .panel {
            background: #232833;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #2d3340;
        }
        .panel h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #a8b1c2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .camera-frame {
            width: 100%;
            border-radius: 6px;
            background: #000;
            display: block;
        }
        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: #1d3d2b;
            color: #4ade80;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid #2d3340;
        }
        th {
            color: #8b94a3;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }
        tr:hover { background: #2a3140; }
        .dir-in { color: #4ade80; }
        .dir-out { color: #f87171; }
        .empty {
            text-align: center;
            padding: 30px;
            color: #5a6373;
            font-size: 13px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { background: #2563eb; }
        button.secondary {
            background: #2d3340;
        }
        button.secondary:hover { background: #3a4151; }
        .meta {
            color: #8b94a3;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>🎥 Cam Access Monitor</h1>
    <div class="subtitle">Наблюдение за камерой и учёт пропусков</div>
</header>

<div class="grid">

    <!-- ЛЕВАЯ ПАНЕЛЬ: КАМЕРА -->
    <div class="panel">
        <h2>Камера · cam1</h2>
        <img id="camera" class="camera-frame" src="/frame" alt="Кадр с камеры">
        <div class="meta">
            <span class="status" id="status">● LIVE</span>
            <span id="frame-time">—</span>
        </div>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ: СОБЫТИЯ -->
    <div class="panel">
        <h2>Последние события</h2>

        <div class="toolbar">
            <button onclick="loadEvents()">Обновить</button>
            <button class="secondary" onclick="simulateAccess()">Симулировать проход</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Время</th>
                    <th>Карта</th>
                    <th>Имя</th>
                    <th>Направление</th>
                </tr>
            </thead>
            <tbody id="events-body">
                <tr><td colspan="4" class="empty">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const API = "/api";

    // ====== Загрузка событий ======
    async function loadEvents() {
        try {
            const r = await fetch(API + "/events?limit=20");
            if (!r.ok) throw new Error("HTTP " + r.status);
            const events = await r.json();
            renderEvents(events);
        } catch (e) {
            document.getElementById("events-body").innerHTML =
                `<tr><td colspan="4" class="empty">Ошибка: ${e.message}</td></tr>`;
        }
    }

    function renderEvents(events) {
        const tbody = document.getElementById("events-body");
        if (!events.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty">Событий пока нет</td></tr>';
            return;
        }
        tbody.innerHTML = events.map(e => {
            const time = new Date(e.created_at).toLocaleString("ru-RU");
            const dir = e.direction === "in"
                ? '<span class="dir-in">→ вход</span>'
                : '<span class="dir-out">← выход</span>';
            return `<tr>
                <td>${time}</td>
                <td>${e.card_id}</td>
                <td>${e.user_name || "—"}</td>
                <td>${dir}</td>
            </tr>`;
        }).join("");
    }

    // ====== Автообновление кадра ======
    function refreshFrame() {
        const img = document.getElementById("camera");
        img.src = "/frame?t=" + Date.now();
        document.getElementById("frame-time").textContent =
            "обновлено " + new Date().toLocaleTimeString("ru-RU");
    }

    // ====== Симуляция прохода ======
    async function simulateAccess() {
        const dirs = ["in", "out"];
        const cards = ["CARD-001", "CARD-002", "CARD-003", "CARD-007"];
        const names = ["Иван Иванов", "Мария Петрова", "Пётр Сидоров", "Анна Кузнецова"];

        const i = Math.floor(Math.random() * cards.length);
        const payload = {
            card_id: cards[i],
            user_name: names[i],
            direction: dirs[Math.floor(Math.random() * dirs.length)],
            gate: "main"
        };

        await fetch(API + "/events", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        loadEvents();
    }

    // ====== Периодика ======
    refreshFrame();
    loadEvents();
    setInterval(refreshFrame, 5000);
    setInterval(loadEvents, 10000);
</script>

</body>
</html>
