# docker-compose.yml
# Описание всех сервисов проекта. Запуск: docker compose up -d

services:
  # ============================================
  # PostgreSQL — база данных для событий проходов
  # ============================================
  db:
    image: postgres:16-alpine          # лёгкий образ PostgreSQL 16
    container_name: cam-db             # имя контейнера (для удобства)
    restart: unless-stopped            # автозапуск при падении/перезагрузке
    environment:                       # переменные окружения для PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"                    # проброс порта наружу (для отладки)
    networks:
      - cam-net                        # подключён к общей сети

  # ============================================
  # MediaMTX — эмулятор RTSP-камеры
  # ============================================
  mediamtx:
    image: bluenviron/mediamtx:latest  # официальный образ MediaMTX
    container_name: cam-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"                    # RTSP-порт — сюда публикуется поток
      - "8888:8888"                    # HLS — можно смотреть в браузере
      - "8889:8889"                    # WebRTC — тоже браузерный просмотр
    networks:
      - cam-net
  # ============================================
  # Backend — FastAPI, работает с БД и кадрами
  # ============================================
  backend:
    build: ./backend                     # собираем из Dockerfile
    container_name: cam-backend
    restart: unless-stopped
    depends_on:
      - db                               # ждём, пока поднимется БД
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FRAMES_DIR: /frames                # внутри контейнера
    volumes:
      - ./frames:/frames:ro              # монтируем папку с кадрами (read-only)
    expose:
      - "8000"
    networks:
      - cam-net
  # ============================================
  # Nginx — reverse proxy + раздача статики
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: cam-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"                          # основной сайт
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - cam-net
# ============================================
# Постоянные тома — переживают перезапуски
# ============================================
volumes:
  db_data:

# ============================================
# Внутренняя сеть — все сервисы видят друг друга по именам
# ============================================
networks:
  cam-net:
    driver: bridge
